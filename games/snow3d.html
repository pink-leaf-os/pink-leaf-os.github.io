<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snow Rider 3D</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/TemplateData/style.css">
  
  <!-- Dependency Scripts -->
  <script src="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/TemplateData/UnityProgress.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/Build/UnityLoader.js"></script>

  <style>
    /* Forces the sandboxed browser window to use 100% of the available space without scrollbars */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* Keeps a clean black backdrop while loading */
    }
    .webgl-content {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #gameContainer {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <script>
    // Unity Loader initialization using the explicit open-source assets
    var gameInstance = UnityLoader.instantiate(
      "gameContainer", 
      "https://cdn.jsdelivr.net/gh/drippy-cat/snowrider3D@c82fe583cbffafa502b0aa3ed2da0053972e0c80/Build/SnowRider3D-gd-1.json", 
      {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function() {
            UnityProgress(gameInstance, "complete");
          }
        }
      }
    );
  </script>

</body>
</html>
