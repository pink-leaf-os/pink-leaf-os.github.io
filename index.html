<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassicOS</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/menu.png">
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#menuImage").click(function (e) {
                e.preventDefault();
                $("#windowMenu").slideToggle();
            });
        });

        function openCloak() {
            let win = window.open();
            let url = "https://classic-os.pages.dev";

            let $iframe = $("<iframe>", {
                src: url,
                css: {
                    width: "100%",
                    height: "100%",
                    border: "none"
                }
            });

            $(win.document.body).append($iframe);
        }
        function openPath(stringPath) {
            $("#app-window").remove();

            let $iframe = $("<iframe>", {
                src: stringPath,
                id: "app-window",
                css: {
                    width: "80%",
                    height: "70%",
                    border: "black solid 10px",
                    margin: "auto",
                    display: "block"
                }
            });

            $(".os").append($iframe);
            $("#app-window").hide();
            $("#app-window").fadeToggle();
        }
    </script>
</head>

<body>
    <div class="os">
        <div id="windowMenu">
            <button onclick="openPath('/games');">Games</button><br />
            <button onclick="openPath('/chat');">Chat</button><br />
            <button onclick="openPath('/code');">Code Editor</button><br />
            <button onclick="openCloak();">Cloaker</button><br />
        </div>
    </div>
    <div class="taskbar">
        <img src="/assets/menu.png" id="menuImage" />
    </div>
</body>

</html>
