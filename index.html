<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassicOS</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/assets/menu.png">
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#menuImage").click(function (e) {
                e.preventDefault();
                $("#windowMenu").slideToggle();
            });
        });

        function openCloak() {
            let win = window.open();
            let url = "https://classic-os.pages.dev";

            let $iframe = $("<iframe>", {
                src: url,
                css: {
                    width: "100%",
                    height: "100%",
                    border: "none",
                    margin: "0",
                    padding: "0"
                }
            });

            $(win.document.body).append($iframe); 
        }

        function openPath(stringPath) {
            $("#app-window").remove();

            let borderWindow = $("<div>", {
                id: "app-window",
                css: {
                    width: "100%",
                    height: "100%",
                    margin: "0",
                    padding: "0"
                }
            })

            let iframe = $("<iframe>", {
                src: stringPath,
                id: "display-window",
                css: {
                    width: "calc(100% - 40px)",
                    height: "calc(100% - 100px)",
                    border: "#99B4D1 solid 20px",
                    margin: "0",
                    padding: "0",
                    margin: "auto",
                    display: "block"
                }
            });

            $(".os").append(borderWindow);
            $("#app-window").append(iframe);
            $("#app-window").hide();
            $("#app-window").fadeIn();
        }

       
    </script>
</head>

<body>
    <div class="os">
        <div id="windowMenu">
            <button onclick="openPath('/games');">Games</button><br />
            <button onclick="openPath('/chat');">Chat</button><br />
  
           
        </div>
    </div>
    <div class="taskbar">
        <img src="/assets/menu.png" id="menuImage" />
    </div>
</body>

</html>
